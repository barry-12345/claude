const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function weightedPick(w) {
  let sum = 0; for (const k in w) sum += w[k];
  if (sum <= 0) return null;
  let r = Math.random() * sum;
  for (const k in w) { r -= w[k]; if (r <= 0) return k; }
  return null;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function T(c, s, x, y, o = {}) {
  c.save();
  c.font = `${o.bold === false ? '' : 'bold '}${o.size || 20}px ${FONT}`;
  c.textAlign = o.align || 'left'; c.textBaseline = o.base || 'middle';
  if (o.alpha != null) c.globalAlpha = o.alpha;
  if (o.stroke) { c.lineWidth = o.sw || 4; c.lineJoin = 'round'; c.strokeStyle = o.stroke; c.strokeText(s, x, y); }
  c.fillStyle = o.color || '#fff'; c.fillText(s, x, y);
  c.restore();
}
function wrapLines(c, s, maxW) {
  const lines = []; let cur = '';
  for (const ch of s) {
    if (ch === '\n') { lines.push(cur); cur = ''; continue; }
    if (c.measureText(cur + ch).width > maxW) {
      const isW = q => /[0-9A-Za-z%.$+\-]/.test(q);
      let k = cur.length;
      if (isW(ch) && isW(cur[cur.length - 1])) { while (k > 0 && isW(cur[k - 1])) k--; }   // do not split numbers / words
      if (k > 0 && k < cur.length) { lines.push(cur.slice(0, k)); cur = cur.slice(k) + ch; } else { lines.push(cur); cur = ch; }
    } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}

function endRound() {
  const target = curTarget();
  if (isSolo()) {
    const p = G.players[0], passed = p.money >= target;
    let saved = false;
    if (!passed && p.medal) { p.medal = false; saved = true; }
    const stars = passed ? starsFor(G.round, p.roundGain, p.money) : 0;
    G.stars[G.round - 1] = stars; G.soloCum[G.round - 1] = p.money; G.soloSaved[G.round - 1] = saved;
    G.results = [{ wasAlive: true, income: p.money - p.roundStart, total: p.money, caught: p.caught, target, passed, saved, over: !passed && !saved, stars }];
    if (passed || saved) G.cleared = G.round;
    G.screen = 'results'; G.resultsT = 0;
    Snd.play(passed || saved ? 'pass' : 'fail');
    return;
  }
  if (isCoop()) {
    const total = G.teamMoney, passed = total >= target;
    let saved = false;
    if (!passed) {
      const holder = G.players.find(p => p.medal);
      if (holder) { holder.medal = false; saved = true; }
    }
    G.results = G.players.map(p => ({ wasAlive: true, income: p.roundGain, total: p.money, caught: p.caught, target, passed, saved }));
    G.teamResult = { income: total - G.teamRoundStart, total, target, passed, saved, over: !passed && !saved };
    if (passed || saved) G.cleared = G.round;
    G.screen = 'results'; G.resultsT = 0;
    Snd.play(passed || saved ? 'pass' : 'fail');
    return;
  }
  G.results = G.players.map(p => {
    const was = p.alive;
    const r = { wasAlive: was, income: was ? p.money - p.roundStart : 0, total: p.money, caught: p.caught, target, passed: was && p.money >= target, saved: false };
    if (was && !r.passed && p.medal) { p.medal = false; r.saved = true; }
    if (was && !r.passed && !r.saved) { p.alive = false; p.elimRound = G.round; }
    return r;

}

function finishGame() {

    const stars = G.stars.reduce((a, b) => a + b, 0);
    const rec = { cleared: G.cleared, stars, money: p.money, char: p.char || 0, perRound: G.soloCum.slice() };
    const best = loadSoloBest();
    const isNew = !best || rec.cleared > best.cleared || (rec.cleared === best.cleared && (rec.stars > best.stars || (rec.stars === best.stars && rec.money > best.money)));
    if (isNew) saveSoloBest(rec);

      scores: [{ player: 0, score: Math.max(0, Math.round(p.money)), rounds: G.round, char: p.char || 0 }], version: R.version,
      reason: victory ? '你拿下了全部 8 关!' : `通过了 ${G.cleared} 关,在第 ${G.round} 关未达到目标` };
    G.screen = 'final';
    Snd.play(victory ? 'win' : 'fail');
    return;
  }
  if (isCoop()) {
    const victory = G.cleared >= ROUNDS && !G.teamResult.over;
    const rec = { cleared: G.cleared, money: G.teamMoney };
    const best = loadBest();
    const isNew = !best || rec.cleared > best.cleared || (rec.cleared === best.cleared && rec.money > best.money);
    if (isNew) saveBest(rec);
    G.final = { coop: true, victory, cleared: G.cleared, money: G.teamMoney, best: isNew ? rec : best, newBest: isNew, winner: -1,
      scores: [{ player: -1, score: Math.max(0, Math.round(G.teamMoney)), rounds: G.round, char: -1 }], version: R.version,
      reason: victory ? '团队通过了全部 8 关!' : `团队通过了 ${G.cleared} 关,在第 ${G.round} 关未达到目标` };
    G.screen = 'final';
    Snd.play(victory ? 'win' : 'fail');
    return;
  }
  const alive = alivePlayers();
  const [a, b] = G.players;
  let winner = -1, reason = '';
  if (alive.length === 0) {
    if (a.elimRound !== b.elimRound) {
      const w = a.elimRound > b.elimRound ? a : b, l = otherPlayer(w);
      winner = w.id; reason = `${l.name}在第 ${l.elimRound} 关被淘汰,${w.name}坚持到第 ${w.elimRound} 关`;
    } else if (a.money !== b.money) {

    } else reason = `双方同在第 ${a.elimRound} 关被淘汰,金币也相同`;

  else if (alive.length === 1) { winner = alive[0].id; reason = `${otherPlayer(alive[0]).name}在第 ${otherPlayer(alive[0]).elimRound} 关被淘汰`; }
  else if (a.money > b.money) { winner = 0; reason = '双方都通过了 8 关,金币更多者获胜'; }
  else if (b.money > a.money) { winner = 1; reason = '双方都通过了 8 关,金币更多者获胜'; }
  else reason = '双方都通过了 8 关,金币也相同';
  G.final = { coop: false, winner, reason, version: R.version,
    scores: G.players.map(p => ({ player: p.id, score: Math.max(0, Math.round(p.money)), rounds: p.alive ? G.round : p.elimRound, char: p.char || 0 })) };
  G.screen = 'final';

//  Shop

function shopPool(p) {
  let ids = Object.keys(SHOP);
  if (isCoop() || isSolo()) ids = ids.filter(i => i !== 'shield');
  if (p.medal || (isCoop() && G.players.some(q => q.medal))) ids = ids.filter(i => i !== 'medal');
  return ids;
}
// single player: 6 goods priced with the star discount; `basePrice` keeps the undiscounted price
function soloOffers(p, discount) {
  const ids = shopPool(p).filter(id => !(SHOP[id].buff && p.pending[SHOP[id].buff]));   // never re-offer a boost already bought
  return shuffle(ids).slice(0, SOLO_SHOP_N).map(id => {
    const basePrice = Math.round(SHOP[id].base * (1 + R.shopEsc * (G.round - 1)) * rand(0.85, 1.15) / 5) * 5;
    return { id, basePrice, price: discPrice(basePrice, discount), count: 0 };
  });
}
const soloRerollPrice = s => discPrice(30 + 15 * G.round + 30 * s.rerolls, s.discount);
function openSoloShop() {
  const p = G.players[0], stars = G.stars[G.round - 1] || 0, discount = STAR_DISCOUNT[stars];
  if (stars >= 3) p.dyn++;                                  // 3-star bonus: a free stick of dynamite
  const s = { offers: soloOffers(p, discount), sel: 0, ready: false, msg: '', msgT: 0, stars, discount, bonusDyn: stars >= 3, rerolls: 0, armed: false, armT: 0 };
  s.rerollIdx = s.offers.length; s.rerollPrice = soloRerollPrice(s);
  G.shop = [s];
  G.screen = 'shop'; G.shopStartT = G.t;
}
function soloReroll(p, s) {
  if (moneyOf(p) < s.rerollPrice) { shopMsg(s, '金币不足!'); Snd.play('deny'); return; }
  spend(p, s.rerollPrice); s.rerolls++;
  s.offers = soloOffers(p, s.discount); s.rerollIdx = s.offers.length; s.rerollPrice = soloRerollPrice(s); s.sel = s.rerollIdx;
  shopMsg(s, '货架已刷新'); Snd.play('buy');
}
function openShop() {
  if (isSolo()) { openSoloShop(); return; }
  G.shop = G.players.map(p => {
    if (!p.alive) return null;
    const n = Math.random() < 0.5 ? 5 : 6;
    const offers = shuffle(shopPool(p)).slice(0, n).map(id => ({
      id, price: Math.round(SHOP[id].base * (1 + R.shopEsc * (G.round - 1)) * rand(0.85, 1.15) / 5) * 5, count: 0,
    }));
    return { offers, sel: 0, ready: false, msg: '', msgT: 0 };
  });
  G.screen = 'shop'; G.shopStartT = G.t;
}
function shopMsg(s, m) { s.msg = m; s.msgT = 1.6; }
function shopAction(pi, act) {
  const p = G.players[pi], s = G.shop[pi];
  if (!p.alive || !s) return;
  const n = s.offers.length + (isSolo() ? 2 : 1);           // single player: goods + refresh card + ready card
  const confirm2 = isSolo() && R.polish;                    // rule 2: the single-player shop needs two presses of "ready"
  if (act === 'left') { s.armed = false; s.armT = 0; s.sel = (s.sel + n - 1) % n; Snd.play('select'); }
  else if (act === 'right') { s.armed = false; s.armT = 0; s.sel = (s.sel + 1) % n; Snd.play('select'); }
  else if (act === 'ready') { if (confirm2) soloArm(s); else toggleReady(s); }
  else if (act === 'reroll' && isSolo()) soloReroll(p, s);
  else if (act === 'buy') {
    if (isSolo()) {
      if (s.sel === s.rerollIdx + 1) { if (confirm2) { s.ready = true; Snd.play('ready'); } else toggleReady(s); return; }   // cursor on the ready card: one press is enough
      s.armed = false; s.armT = 0;
      if (s.sel === s.rerollIdx) { soloReroll(p, s); return; }
    }
    if (s.sel === s.offers.length) { toggleReady(s); return; }
    const o = s.offers[s.sel], d = SHOP[o.id];
    if (o.count > 0 && !d.stack) { shopMsg(s, '已经买过了'); Snd.play('deny'); return; }
    if (d.special === 'medal' && (p.medal || (isCoop() && G.players.some(q => q.medal)))) { shopMsg(s, '已经拥有免死金牌'); Snd.play('deny'); return; }
    if (moneyOf(p) < o.price) { shopMsg(s, '金币不足!'); Snd.play('deny'); return; }
    spend(p, o.price); o.count++;
    if (d.special === 'medal') p.medal = true;
    else if (d.stack) p.dyn++;

function soloArm(s) {

}
function toggleReady(s) { s.ready = !s.ready; Snd.play(s.ready ? 'ready' : 'select'); }
function updateShop(dt) {
  for (const s of G.shop) if (s && s.msgT > 0) s.msgT -= dt;
  for (const s of G.shop) if (s && s.armT > 0 && (s.armT -= dt) <= 0) { s.armT = 0; s.armed = false; }
  const alive = G.shop.filter(s => s);
  if (alive.length && alive.every(s => s.ready)) { startRound(); Snd.play('start'); }
}

// ---------------------------------------------------------------------

function pauseGame() { G.paused = true; G.pauseSel = 0; Snd.setPaused(true); }
function resumeGame() { G.paused = false; G.noFireT = 0.2; Snd.setPaused(false); }
function handlePauseKey(code) {
  if (code === 'KeyP' || code === 'Escape') { resumeGame(); return; }
  if (code === 'KeyW' || code === 'ArrowUp') G.pauseSel = (G.pauseSel + 2) % 3;
  else if (code === 'KeyS' || code === 'ArrowDown') G.pauseSel = (G.pauseSel + 1) % 3;
  else if (code === 'Space' || code === 'Enter' || code === 'NumpadEnter') {
    if (G.pauseSel === 0) resumeGame();
    else if (G.pauseSel === 1) { startGame(); G.noFireT = 0.2; }                       // restart, same mode
    else { G.paused = false; Snd.setPaused(false); G.screen = 'start'; G.players = []; }   // main menu
  }
}

//  Input
// ---------------------------------------------------------------------
const BLOCK = new Set(['KeyS', 'KeyW', 'KeyA', 'KeyD', 'ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab', 'Escape', 'Enter']);
function selectKey(code) {
  const S = G.sel;
  if (code === 'Escape') { G.screen = 'start'; return; }
  if (isSolo()) {                                           // only the first selector counts
    const st = S[0], k = SOLO_CFG.keys;
    if (code === k.left && !st.ready) { st.idx = (st.idx + CHARS.length - 1) % CHARS.length; Snd.play('select'); }
    else if (code === k.right && !st.ready) { st.idx = (st.idx + 1) % CHARS.length; Snd.play('select'); }
    else if (code === k.buy && !st.ready) { st.ready = true; Snd.play('ready'); }
    else if (code === k.ready && st.ready) { st.ready = false; Snd.play('select'); }
    else if (code === 'Space' && st.ready) beginWithChars();
    return;
  }
  for (const cfg of PLAYER_CFG) {
    const k = cfg.keys, st = S[cfg.id];
    if (code === k.left && !st.ready) { st.idx = (st.idx + CHARS.length - 1) % CHARS.length; Snd.play('select'); }
    else if (code === k.right && !st.ready) { st.idx = (st.idx + 1) % CHARS.length; Snd.play('select'); }
    else if (code === k.buy && !st.ready) { st.ready = true; Snd.play('ready'); }
    else if (code === k.ready && st.ready) { st.ready = false; Snd.play('select'); }
  }
  if (code === 'Space' && S[0].ready && S[1].ready) beginWithChars();
}
function beginWithChars() { G.chars = [G.sel[0].idx, isSolo() ? G.chars[1] : G.sel[1].idx]; G.selT = 0; startGame(); }
function setMenuMode(i) { i = clamp(i, 0, MENU_ORDER.length - 1); if (G.menuMode !== i) { G.menuMode = i; lsSet('goldminer.mode', MENU_ORDER[i]); Snd.play('select'); } }
const ARROW_TO_WASD = { ArrowDown: 'KeyS', ArrowUp: 'KeyW', ArrowLeft: 'KeyA', ArrowRight: 'KeyD' };
const DIGIT_MODE = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 };
function handleKey(code) {
  if (code === 'KeyM') { Snd.muted = !Snd.muted; return; }
  if (code === 'KeyV') { setReduceFx(!reduceFxOn); G.toast = reduceFxOn ? 'V 特效:关' : 'V 特效:开'; G.toastT = 1.5; return; }
  if (G.paused) { handlePauseKey(code); return; }
  if ((code === 'KeyP' || code === 'Escape') && (G.screen === 'intro' || G.screen === 'play')) { pauseGame(); return; }
  if (isSolo() && ARROW_TO_WASD[code] && (G.screen === 'select' || G.screen === 'play' || G.screen === 'shop')) code = ARROW_TO_WASD[code];   // arrows == WASD for the lone miner
  switch (G.screen) {
    case 'start':
      if (code === 'KeyA' || code === 'ArrowLeft') setMenuMode(G.menuMode - 1);
      else if (code === 'KeyD' || code === 'ArrowRight') setMenuMode(G.menuMode + 1);
      else if (code in DIGIT_MODE) setMenuMode(DIGIT_MODE[code]);
      else if (code === 'Tab') G.legendPage = (G.legendPage + 1) % LEGEND_PAGE_COUNT;
      else if (code === 'Space') {
        G.mode = MENU_ORDER[G.menuMode]; lsSet('goldminer.mode', G.mode);
        G.sel = [{ idx: G.chars[0], ready: false }, { idx: G.chars[1], ready: false }]; G.selT = 0; G.screen = 'select';
      }
      break;
    case 'select': selectKey(code); break;
    case 'final':
      if (code === 'Space') startGame();
      else if (code === 'Escape') { G.screen = 'start'; G.players = []; }
      break;
    case 'intro': if (code === 'Space') G.introT = 0; break;
    case 'results': if (code === 'Space' && G.resultsT > 0.4) afterResults(); break;
    case 'play':
      for (const p of G.players) {
        if (!p.alive) continue;
        if (code === p.cfg.keys.fire) {
          if (G.tug) { if (p.id === G.tug.holder || p.id === G.tug.ch) tugPress(p); }   // mashing during a tug
          else fireHook(p);
        } else if (code === p.cfg.keys.dyn) useDynamite(p);
      }
      break;
    case 'shop':
      if (G.t - G.shopStartT < 0.25) break;
      for (const p of G.players) {
        const k = p.cfg.keys;
        if (code === k.left) shopAction(p.id, 'left');
        else if (code === k.right) shopAction(p.id, 'right');
        else if (code === k.buy) shopAction(p.id, 'buy');
        else if (code === k.ready) shopAction(p.id, 'ready');
      }
      break;
  }
}
addEventListener('keydown', e => {
  if (BLOCK.has(e.code)) e.preventDefault();
  Snd.init();
  if (e.repeat) return;
  handleKey(e.code);
});

// ---------------------------------------------------------------------
//  Update
// ---------------------------------------------------------------------
function update(dt) {
  if (G.paused) return;
  G.t += dt;
  if (G.noFireT > 0) G.noFireT -= dt;
  runSched(dt);
  switch (G.screen) {
    case 'intro':
      updateItems(dt);
      G.introT -= dt;
      if (G.introT <= 0) { G.screen = 'play'; Snd.play('ready'); }
      break;
    case 'play': if (G.hitStop > 0) G.hitStop = Math.max(0, G.hitStop - dt); else updatePlay(dt); break;   // freeze-frame: everything but fx pauses
    case 'results': {
      const before = G.resultsT; G.resultsT += dt;
      if (isSolo()) for (let k = 0; k < G.results[0].stars; k++) if (before < STAMP_T0 + k * STAMP_DT && G.resultsT >= STAMP_T0 + k * STAMP_DT) Snd.play(k === 2 ? 'diamond' : 'coin', 300);   // star stamp sounds
      break;
    }
    case 'shop': updateShop(dt); break;
    case 'select':
      if (G.sel[0].ready && (isSolo() || G.sel[1].ready)) { G.selT += dt; if (G.selT > 0.8) beginWithChars(); } else G.selT = 0;
      break;
  }
  updateFx(dt);
  if (R.feel) rollDisplays(dt);
}
// feel pack: HUD money counts up/down towards the real value (drawing only)
function rollTo(cur, target, dt) {
  const d = target - cur, step = Math.max(300, Math.abs(d) * 6) * dt;
  return Math.abs(d) <= step ? target : cur + Math.sign(d) * step;
}
function rollDisplays(dt) {
  for (const p of G.players) p.disp = rollTo(p.disp, p.money, dt);
  G.dispTeam = rollTo(G.dispTeam, G.teamMoney, dt);
}

const THEME_PAL = [

    const cx = x + 24 + cell * (i + 0.5), played = i < G.stars.length, st = played ? G.stars[i] : 0, failed = played && st === 0, saved = !!G.soloSaved[i];
    T(c, `第${i + 1}关`, cx, y + 192, { size: 16, align: 'center', color: played ? '#cfe0ff' : '#6f7aa0', bold: false });
    for (let k = 0; k < 3; k++) drawStar(c, cx + (k - 1) * 30, y + 228, 12, k < st);
    if (saved) {   // survived on the medal: yellow label + the cumulative money at that moment
      T(c, '金牌保住', cx, y + 262, { size: 15, align: 'center', color: '#ffc83a' });
      T(c, fmt(G.soloCum[i]), cx, y + 284, { size: 13, align: 'center', color: '#ffe36b', bold: false });
    } else T(c, !played ? '—' : failed ? '未达标' : fmt(G.soloCum[i]), cx, y + 268, { size: 14, align: 'center', color: failed ? '#ff8a7a' : played ? '#ffe36b' : '#6f7aa0', bold: false });
  }
  T(c, '按空格再来一局', W / 2, 650, { size: 40, align: 'center', color: '#fff', stroke: '#7a2a08', sw: 8, alpha: 0.6 + 0.4 * Math.sin(t * 5) });
  T(c, 'Esc 返回主菜单', W / 2, 694, { size: 15, align: 'center', color: '#aab', bold: false });
}

function drawPause(c) {
  dim(c, 0.62);
  panel(c, W / 2 - 230, 190, 460, 340, { fill: 'rgba(20,24,52,0.95)', stroke: '#ffd23a', lw: 4 });
  T(c, '已暂停', W / 2, 242, { size: 48, align: 'center', color: '#ffd23a', stroke: '#7a3a08', sw: 8 });
  ['继续游戏', '重新开始', '返回主菜单'].forEach((txt, i) => {
    const y = 322 + i * 62, sel = G.pauseSel === i;
    rr(c, W / 2 - 180, y - 25, 360, 50, 12); c.fillStyle = sel ? 'rgba(255,210,58,0.28)' : 'rgba(255,255,255,0.06)'; c.fill();
    c.lineWidth = sel ? 3 : 1.5; c.strokeStyle = sel ? '#ffd23a' : 'rgba(255,255,255,0.25)'; c.stroke();
    T(c, txt, W / 2, y, { size: 26, align: 'center', color: sel ? '#fff' : '#cfe0ff' });
    if (sel) { c.fillStyle = '#ffd23a'; c.beginPath(); c.moveTo(W / 2 - 160, y - 10); c.lineTo(W / 2 - 146, y); c.lineTo(W / 2 - 160, y + 10); c.closePath(); c.fill(); }
  });
  T(c, 'W/S 或 ↑/↓ 选择    空格/回车 确认    P/Esc 继续', W / 2, 510, { size: 14, align: 'center', color: '#aab', bold: false });
}

// feel pack: red screen-edge vignette during the last 10 seconds (static when effects are reduced)
function drawVignette(c) {
  if (!R.feel || G.timeUp || G.time > 10) return;
  const a = reduceFxOn ? 0.1 : 0.1 + 0.05 * Math.sin(G.t * 4);
  const g = c.createRadialGradient(W / 2, H / 2, H * 0.38, W / 2, H / 2, H * 0.98);
  g.addColorStop(0, 'rgba(230,20,20,0)'); g.addColorStop(1, `rgba(230,20,20,${a * 3})`);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}
function render() {
  const c = ctx;
  c.setTransform(scaleF, 0, 0, scaleF, 0, 0);
  c.clearRect(0, 0, W, H);
  c.save();
  if (G.shake > 0 && !reduceFxOn) c.translate((fxRand() - 0.5) * G.shake * 16, (fxRand() - 0.5) * G.shake * 16);
  if (G.zoomT > 0 && !reduceFxOn && (G.screen === 'play')) {   // big-win camera push: 1.0 -> 1.04 -> 1.0 around the miner
    const z = 1 + 0.04 * Math.sin(Math.PI * (1 - G.zoomT / 0.3)), zy = GROUND_Y - 40;
    c.translate(G.zoomX, zy); c.scale(z, z); c.translate(-G.zoomX, -zy);
  }
  switch (G.screen) {
    case 'start': drawStart(c, G.t); break;
    case 'select': drawSelect(c, G.t); break;
    case 'intro': drawIntro(c, G.t); break;
    case 'play': drawScene(c, G.t); drawHUD(c); drawVignette(c); break;
    case 'results': drawResults(c, G.t); break;
    case 'shop': drawShop(c, G.t); break;
    case 'final': drawFinal(c, G.t); break;
  }
  c.restore();
  if (G.paused) drawPause(c);
  if (G.toastT > 0) {   // bottom-right toast (V key)
    const a = clamp(G.toastT / 0.3, 0, 1);
    c.save(); c.font = `bold 18px ${FONT}`; const tw = c.measureText(G.toast).width + 28; c.restore();
    c.save(); c.globalAlpha = a; rr(c, W - 16 - tw, H - 64, tw, 34, 10); c.fillStyle = 'rgba(16,22,52,0.92)'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#ffd23a'; c.stroke(); c.restore();
    T(c, G.toast, W - 30, H - 47, { size: 18, align: 'right', color: '#ffe36b', alpha: a });
  }
}

// ---------------------------------------------------------------------
//  Main loop (fixed timestep)
// ---------------------------------------------------------------------
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  if (G.toastT > 0) G.toastT -= dt;
  acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}

// debug hook for tests
window.__game = {
  G, ITEMS, TARGETS, COOP_TARGETS, SHOP, HOOK, FAST, LEGEND_PAGES, Snd,
  press: handleKey,
  // test helpers: deterministic RNG and "jump straight into a mode" (skips the menu)
  reseed(n) { Math.random = mulberry(n); fxGen = mulberry((n ^ 0x5f3759df) | 0); },
  startMode(mode, chars = [0, 1]) { G.mode = mode; G.chars = chars.slice(); startGame(); },
  SOLO_TARGETS, STAR_MULT, MENU_ORDER, PIVOT_Y, W, H, isSolo, starsFor, loadSoloBest, saveSoloBest, targets,
  // ---- phase 2
  RULESETS, get R() { return R; }, get RULE_VERSION() { return RULE_VERSION; },
  setRules(v) { if (G.screen === 'start' && RULESETS[v]) { RULE_VERSION = v; R = RULESETS[v]; } },   // start screen only
  finaleCount, worthClear, spawnFinale, isReduceFx, reduceFx: setReduceFx, fxRand, starGoal, freeSpot, reachable,
  placeItem(type, x, y) {                                   // add one item to the current field; null when it would overlap
    const it = makeItem(type, x, y), def = ITEMS[type];
    if (def.mover) { const o = occFor(it, x, y); it.occ = o.occ; it.minX = o.lo; it.maxX = o.hi; it.speed = 60; }
    const all = []; for (const o of G.items) if (!o.dead) for (const c of o.occ) all.push(c);
    for (const h of G.hazards) for (const c of h.occ) all.push(c);
    if (occOverlap(it.occ, all, 6)) return null;
    G.items.push(it); return it;
  },
  clearField() { G.items = []; },
  advance(sec) { const n = Math.round(sec / STEP); for (let i = 0; i < n; i++) update(STEP); },
  generateLevel, levelWorth, hookTip, endRound, makeItem, explodeTNT, startGame, startRound, selectKey, reshuffle, spawnMeteor, tugPress, resolveTug, startTug, rollEvent, slabState, ventState, slabBlocks, plumeAt, burnHook, occFor, CHARS, EVENTS, THEMES, themeOf, pauseGame, resumeGame, loadBest, saveBest, deliver, finishGame, afterResults, shopAction, openShop, curTarget,
};

resize();
requestAnimationFrame(frame);
})();
